name: Quality gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sceneit_test
          POSTGRES_USER: sceneit
          POSTGRES_PASSWORD: sceneit-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sceneit -d sceneit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://sceneit:sceneit-test-only@127.0.0.1:5432/sceneit_test_runtime
      SCENEIT_TEST_DATABASE_URL: postgresql://sceneit:sceneit-test-only@127.0.0.1:5432/sceneit_test
      SCENEIT_DISABLE_PROVIDER_NETWORK: "1"
      PILOT_ALLOWED_SUBJECTS: ci-test-subject
      TRUSTED_HOSTS: localhost,127.0.0.1
      SESSION_SECRET: ci-test-session-secret-not-for-production
      PRIVATE_OBJECT_DIR: ci-sceneit-private
      REPL_ID: ci-test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.24"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg postgresql-client
      - name: Install browser fixture runtime
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @workspace/sceneit exec playwright install --with-deps chromium
      - name: Exercise explicit migration status and upgrade
        run: |
          uv sync --locked
          PGPASSWORD=sceneit-test-only createdb --host=127.0.0.1 --username=sceneit sceneit_test_runtime
          (cd artifacts/api-server && uv run --locked python -m sceneit.migrate status)
          (cd artifacts/api-server && uv run --locked python -m sceneit.migrate upgrade --operator-approved)
          (cd artifacts/api-server && uv run --locked python -m sceneit.migrate status)
          (cd artifacts/api-server && uv run --locked python -m sceneit.migrate upgrade --operator-approved)
          (cd artifacts/api-server && uv run --locked python ../../scripts/seed-rehearsal.py)
      - name: Rehearse production-style restart
        env:
          PORT: "18080"
        run: bash scripts/restart-rehearsal.sh
      - name: Run locked release checks
        run: bash scripts/release-check.sh