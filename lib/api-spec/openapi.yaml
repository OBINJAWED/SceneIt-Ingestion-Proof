      properties:
        id: { type: string }
        title: { type: string }
        youtubeVideoId: { type: string }
        youtubeUrl: { type: string }
        durationSeconds: { type: number }
        width: { type: integer }
        height: { type: integer }
        fileSizeBytes: { type: integer }
        hasAudio: { type: boolean }
        state: { type: string, enum: [queued, uploading, processing, indexing, ready, failed, needs_review] }
        statusMessage: { type: string }
        model: { type: string }
        timelineStatus: { type: string, enum: [unverified, verified, mismatch] }
        sourcePlaybackAvailable: { type: boolean }
        sourcePlaybackUrl: { type: ["string", "null"] }
        checks:
          type: array
          items:
            $ref: "#/components/schemas/ProofCheck"
        searchesUsed: { type: integer }
        searchLimit: { type: integer }
        updatedAt: { type: string }
    SceneQuery:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query: { type: string, minLength: 1, maxLength: 500 }
        modality: { type: string, enum: [both, visual, audio], default: both }
    SceneMatch:
      type: object
      required: [rank, startSeconds, endSeconds, frameUrl, youtubeUrl]
      properties:
        rank: { type: integer }
        startSeconds: { type: number }
        endSeconds: { type: number }
        confidenceLabel: { type: ["string", "null"] }
        frameUrl: { type: string }
        youtubeUrl: { type: string }
    SceneSearch:
      type: object
      required: [id, query, modality, createdAt, latencyMs, matches, provider, partial]
      properties:
        id: { type: string }
        query: { type: string }
        modality: { type: string, enum: [both, visual, audio] }
        createdAt: { type: string }
        latencyMs: { type: integer }
        provider: { type: string, enum: [Twelve Labs] }
        partial: { type: boolean }
        matches:
          type: array
          items:
            $ref: "#/components/schemas/SceneMatch"
    ProofReport:
      type: object
      required: [proof, searches, limitations]
      properties:
        proof:
          $ref: "#/components/schemas/Proof"
        searches:
          type: array
          items:
            $ref: "#/components/schemas/SceneSearch"
        limitations:
          type: array
          items: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ReadinessStatus:
      type: object
      additionalProperties: false
      required: [status, checks, external]
      properties:
        status: { type: string, enum: [ready, not_ready] }
        checks:
          type: object
          additionalProperties: false
          required: [config, database, schema]
          properties:
            config: { type: string, enum: [ok, invalid] }
            database: { type: string, enum: [ok, unavailable] }
            schema: { type: string, enum: [ok, incompatible] }
        external:
          type: object
          additionalProperties: false
          required: [provider]
          properties:
            provider: { type: string, enum: [not_probed] }

