openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: SceneIt one-video ingestion and semantic-search proof.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /auth/session:
    get:
      operationId: getAuthSession
      summary: Read the current pilot session and admission decision
      responses:
        "200":
          description: Current session, admission decision, and CSRF token; never cached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthState"
  /auth/user:
    get:
      operationId: getCurrentAuthUser
      responses:
        "200":
          description: Current session and CSRF token; never cached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthState"
  /login:
    get:
      operationId: login
      parameters:
        - { name: returnTo, in: query, schema: { type: string } }
      responses:
        "302": { description: OIDC authorization redirect }
  /callback:
    get:
      operationId: authCallback
      responses:
        "302": { description: Verified session redirect }
  /logout:
    post:
      operationId: logout
      security: [{ sessionCookie: [], csrfToken: [] }]
      responses:
        "200":
          description: Session revoked
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success: { type: boolean }
  /imports/config:
    get:
      operationId: getImportConfig
      responses:
        "200":
          description: Enforced import limits and worker availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportConfig"
  /imports/current:
    get:
      operationId: getCurrentImport
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Most recent private import, or null
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/VideoImport"
                  - { type: "null" }
  /imports:
    post:
      operationId: createImport
      security: [{ sessionCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateImport"
      responses:
        "200": { $ref: "#/components/responses/ImportResponse" }
        "400": { $ref: "#/components/responses/Failure" }
        "401": { $ref: "#/components/responses/Failure" }
        "409": { $ref: "#/components/responses/Failure" }
        "429": { $ref: "#/components/responses/Failure" }
  /imports/{importId}:
    parameters:
      - $ref: "#/components/parameters/ImportId"
    get:
      operationId: getImport
      security: [{ sessionCookie: [] }]
      responses:
        "200": { $ref: "#/components/responses/ImportResponse" }
        "404": { $ref: "#/components/responses/Failure" }
  /imports/{importId}/upload:
    parameters:
      - $ref: "#/components/parameters/ImportId"
    post:
      operationId: reserveImportUpload
      security: [{ sessionCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadRequest"
      responses:
        "200":
          description: Short-lived immutable private upload reservation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadReservation"
        "400": { $ref: "#/components/responses/Failure" }
        "409": { $ref: "#/components/responses/Failure" }
  /imports/{importId}/complete:
    parameters:
      - $ref: "#/components/parameters/ImportId"
    post:
      operationId: completeImportUpload
      description: Enqueue validation of stored bytes, not proof of completed indexing.
      security: [{ sessionCookie: [], csrfToken: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmptyRequest" }
      responses:
        "200": { $ref: "#/components/responses/ImportResponse" }
        "409": { $ref: "#/components/responses/Failure" }
  /imports/{importId}/cancel:
    parameters:
      - $ref: "#/components/parameters/ImportId"
    post:
      operationId: cancelImport
      security: [{ sessionCookie: [], csrfToken: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmptyRequest" }
      responses:
        "200": { $ref: "#/components/responses/ImportResponse" }
  /imports/{importId}/playback:
    parameters:
      - $ref: "#/components/parameters/ImportId"
    post:
      operationId: authorizeImportPlayback
      security: [{ sessionCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaybackAuthorization" }
      responses:
        "200": { $ref: "#/components/responses/ImportResponse" }
  /imports/{importId}/source:
    parameters:
      - $ref: "#/components/parameters/ImportId"
    get:
      operationId: streamImportSource
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: Range, in: header, schema: { type: string } }
      responses:
        "200":
          description: Owner-authorized private source
          content:
            video/mp4:
              schema: { type: string, format: binary }
        "206":
          description: Owner-authorized source byte range
          content:
            video/mp4:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/Failure" }
        "416": { $ref: "#/components/responses/Failure" }
  /imports/{importId}/searches:
    parameters:
      - $ref: "#/components/parameters/ImportId"
    get:
      operationId: listImportSearches
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Owner-only saved searches
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ImportSearch" }
    post:
      operationId: searchImport
      security: [{ sessionCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SceneQuery" }
      responses:
        "200":
          description: Provider-ranked candidate moments from this indexed asset only
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportSearch" }
        "409": { $ref: "#/components/responses/Failure" }
        "429": { $ref: "#/components/responses/Failure" }
        "502": { $ref: "#/components/responses/Failure" }
  /imports/{importId}/searches/{searchId}/frames/{rank}:
    parameters:
      - $ref: "#/components/parameters/ImportId"
      - { name: searchId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: rank, in: path, required: true, schema: { type: integer, minimum: 1, maximum: 5 } }
    get:
      operationId: getImportFrame
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Private source still at the candidate segment midpoint
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/Failure" }
  /proof:
    get:
      operationId: getProof
      tags: [proof]
      summary: Read the current one-video proof and its measured checks
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Current proof
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proof"
        "401": { $ref: "#/components/responses/ProtectedFailure" }
        "403": { $ref: "#/components/responses/ProtectedFailure" }
        "503": { $ref: "#/components/responses/ProtectedFailure" }
  /proof/readiness:
    get:
      operationId: getProofReadiness
      tags: [proof]
      summary: Read proof search and media readiness without probing providers
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Current proof readiness and degradation state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProofReadiness" }
        "401": { $ref: "#/components/responses/ProtectedFailure" }
        "403": { $ref: "#/components/responses/ProtectedFailure" }
        "503": { $ref: "#/components/responses/ProtectedFailure" }
  /proof/search-operations:
    get:
      operationId: listProofSearchOperations
      tags: [proof]
      summary: List bounded search attempts for operator-visible reconciliation
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Search operations, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SearchOperation" }
        "401": { $ref: "#/components/responses/ProtectedFailure" }
        "403": { $ref: "#/components/responses/ProtectedFailure" }
        "503": { $ref: "#/components/responses/ProtectedFailure" }
  /proof/searches:
    get:
      operationId: listProofSearches
      tags: [proof]
      summary: Previously executed real searches, newest first
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Search history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SceneSearch"
        "401": { $ref: "#/components/responses/ProtectedFailure" }
        "403": { $ref: "#/components/responses/ProtectedFailure" }
        "503": { $ref: "#/components/responses/ProtectedFailure" }
    post:
      operationId: searchScenes
      tags: [proof]
      summary: Search the single indexed video using Twelve Labs
      security: [{ sessionCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SceneQuery"
      responses:
        "200":
          description: Actual provider results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SceneSearch"
        "400":
          $ref: "#/components/responses/Failure"
        "409":
          $ref: "#/components/responses/Failure"
        "429":
          $ref: "#/components/responses/Failure"
        "502":
          $ref: "#/components/responses/Failure"
        "503":
          $ref: "#/components/responses/ProtectedFailure"
        "401": { $ref: "#/components/responses/ProtectedFailure" }
        "403": { $ref: "#/components/responses/ProtectedFailure" }
  /proof/searches/{searchId}/frames/{rank}:
    parameters:
      - { name: searchId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: rank, in: path, required: true, schema: { type: integer, minimum: 1, maximum: 5 } }
    get:
      operationId: getProofFrame
      tags: [proof]
      summary: Read a retained source frame for a shared proof result
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: JPEG source frame
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/ProtectedFailure" }
        "403": { $ref: "#/components/responses/ProtectedFailure" }
        "404": { $ref: "#/components/responses/ProtectedFailure" }
  /proof/report:
    get:
      operationId: getProofReport
      tags: [proof]
      summary: Download measured proof evidence as JSON
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Proof evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProofReport"
        "401": { $ref: "#/components/responses/ProtectedFailure" }
        "403": { $ref: "#/components/responses/ProtectedFailure" }
        "503": { $ref: "#/components/responses/ProtectedFailure" }
  /proof/source:
    get:
      operationId: streamProofSource
      tags: [proof]
      summary: Stream the rights-approved original with HTTP byte-range support
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Complete original source
          content:
            video/mp4:
              schema: { type: string, format: binary }
        "206":
          description: Requested byte range from the original source
          content:
            video/mp4:
              schema: { type: string, format: binary }
        "404":
          $ref: "#/components/responses/Failure"
        "416":
          $ref: "#/components/responses/ProtectedFailure"
        "401": { $ref: "#/components/responses/ProtectedFailure" }
        "403": { $ref: "#/components/responses/ProtectedFailure" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /readyz:
    get:
      operationId: readinessCheck
      tags: [health]
      summary: Check bounded configuration, database, and schema readiness
      responses:
        "200":
          description: Service is ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadinessStatus" }
        "503":
          description: Service is not ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadinessStatus" }
components:
  securitySchemes:
    sessionCookie: { type: apiKey, in: cookie, name: __Host-sceneit_session }
    csrfToken: { type: apiKey, in: header, name: X-CSRF-Token }
  parameters:
    ImportId:
      name: importId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    ImportResponse:
      description: Current private import
      content:
        application/json:
          schema: { $ref: "#/components/schemas/VideoImport" }
    Failure:
      description: Safe, actionable failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiFailure"
    ProtectedFailure:
      description: Typed protected-resource failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProtectedApiFailure"
  schemas:
    EmptyRequest:
      type: object
      additionalProperties: false
    PlaybackAuthorization:
      type: object
      additionalProperties: false
      required: [authorized]
      properties:
        authorized: { type: boolean }
    AuthState:
      type: object
      required: [user, csrfToken, pilotAdmitted]
      properties:
        csrfToken: { type: [string, "null"] }
        pilotAdmitted:
          type: boolean
          description: Server-authoritative pilot admission. False for anonymous, denied, or indeterminate sessions.
        user:
          type: [object, "null"]
          required: [id, firstName]
          properties:
            id: { type: string }
            firstName: { type: [string, "null"] }
    ImportConfig:
      type: object
      required: [maxBytes, minDurationSeconds, maxDurationSeconds, retentionDays, ownerImportLimit, appImportLimit, ownerSearchLimit, appSearchLimit, workerAvailable]
      properties:
        maxBytes: { type: integer }
        minDurationSeconds: { type: number }
        maxDurationSeconds: { type: number }
        retentionDays: { type: integer }
        ownerImportLimit: { type: integer }
        appImportLimit: { type: integer }
        ownerSearchLimit: { type: integer }
        appSearchLimit: { type: integer }
        workerAvailable: { type: boolean }
    CreateImport:
      type: object
      additionalProperties: false
      required: [entryMethod, analysisAuthorized, playbackAuthorized, idempotencyKey]
      properties:
        entryMethod: { type: string, enum: [upload, link] }
        sourceUrl: { type: string, maxLength: 2048 }
        analysisAuthorized: { type: boolean, enum: [true] }
        playbackAuthorized: { type: boolean }
        idempotencyKey: { type: string, format: uuid }
    UploadRequest:
      type: object
      additionalProperties: false
      required: [fileName, sizeBytes, contentType]
      properties:
        fileName: { type: string, minLength: 1, maxLength: 255 }
        sizeBytes: { type: integer, minimum: 1, maximum: 200000000 }
        contentType: { type: string, enum: [video/mp4] }
    UploadReservation:
      type: object
      required: [import, uploadURL, method, headers, expiresAt]
      properties:
        import: { $ref: "#/components/schemas/VideoImport" }
        uploadURL: { type: string }
        method: { type: string, enum: [PUT, POST] }
        headers: { type: object, additionalProperties: { type: string } }
        expiresAt: { type: string }
    VideoImport:
      type: object
      required: [id, title, entryMethod, sourceKind, sourceUrl, externalId, state, statusMessage, progressPercent, errorCode, durationSeconds, fileSizeBytes, hasAudio, sourcePlaybackAvailable, sourcePlaybackUrl, playbackAuthorized, timelineStatus, createdAt, updatedAt, expiresAt, searchesUsed, searchLimit, importsUsed, importLimit]
      properties:
        id: { type: string }
        title: { type: string }
        entryMethod: { type: string, enum: [upload, link] }
        sourceKind: { type: string, enum: [file, youtube, x, tiktok, vimeo] }
        sourceUrl: { type: [string, "null"] }
        externalId: { type: [string, "null"] }
        state: { type: string, enum: [file_required, awaiting_upload, queued, resolving, validating, uploading, processing, indexing, ready, failed, needs_review, cancel_requested, cancelled, expired] }
        statusMessage: { type: string }
        progressPercent: { type: [number, "null"] }
        errorCode: { type: [string, "null"] }
        durationSeconds: { type: [number, "null"] }
        fileSizeBytes: { type: [integer, "null"] }
        hasAudio: { type: [boolean, "null"] }
        sourcePlaybackAvailable: { type: boolean }
        sourcePlaybackUrl: { type: [string, "null"] }
        playbackAuthorized: { type: boolean }
        timelineStatus: { type: string, enum: [not_applicable, unverified] }
        createdAt: { type: string }
        updatedAt: { type: string }
        expiresAt: { type: string }
        searchesUsed: { type: integer }
        searchLimit: { type: integer }
        importsUsed: { type: integer }
        importLimit: { type: integer }
    ImportMatch:
      type: object
      required: [rank, startSeconds, endSeconds, confidenceLabel, frameUrl, sourceUrl]
      properties:
        rank: { type: integer, minimum: 1, maximum: 5 }
        startSeconds: { type: number }
        endSeconds: { type: number }
        confidenceLabel: { type: [string, "null"] }
        frameUrl: { type: string }
        sourceUrl: { type: [string, "null"] }
    ImportSearch:
      type: object
      required: [id, query, modality, createdAt, latencyMs, matches, provider, partial]
      properties:
        id: { type: string }
        query: { type: string }
        modality: { type: string, enum: [both, visual, audio] }
        createdAt: { type: string }
        latencyMs: { type: integer }
        provider: { type: string, enum: [Twelve Labs] }
        partial: { type: boolean }
        matches:
          type: array
          maxItems: 5
          items: { $ref: "#/components/schemas/ImportMatch" }
    ApiFailure:
      type: object
      required: [error, code]
      properties:
        error: { type: string }
        code: { type: string }
    ProtectedApiFailure:
      type: object
      additionalProperties: false
      required: [error, code, state]
      properties:
        error: { type: string }
        code: { type: string }
        state:
          type: string
          enum: [admission_required, quota_exhausted, processing, uncertain, service_unavailable, not_found, unauthorized]
        retryable: { type: boolean, default: false }
        retryAfterSeconds: { type: ["integer", "null"], minimum: 0 }
    ProofReadiness:
      type: object
      additionalProperties: false
      required: [state, proofState, searchAvailable, searchesUsed, searchLimit, detail, retryAfterSeconds]
      properties:
        state:
          type: string
          enum: [ready, admission_required, quota_exhausted, processing, uncertain, service_unavailable]
        proofState:
          type: string
          enum: [queued, uploading, processing, indexing, ready, failed, needs_review]
        searchAvailable: { type: boolean }
        searchesUsed: { type: integer, minimum: 0 }
        searchLimit: { type: integer, minimum: 0 }
        detail: { type: ["string", "null"] }
        retryAfterSeconds: { type: ["integer", "null"], minimum: 0 }
    SearchOperation:
      type: object
      additionalProperties: false
      required: [id, state, attemptId, createdAt, deadlineAt, completedAt, errorCode]
      properties:
        id: { type: string, format: uuid }
        state: { type: string, enum: [running, done, failed, needs_review] }
        attemptId: { type: ["string", "null"], format: uuid }
        createdAt: { type: string, format: date-time }
        deadlineAt: { type: ["string", "null"], format: date-time }
        completedAt: { type: ["string", "null"], format: date-time }
        errorCode: { type: ["string", "null"] }
    ProofCheck:
      type: object
      required: [id, label, status, detail]
      properties:
        id: { type: string }
        label: { type: string }
        status: { type: string, enum: [passed, pending, failed, unverified] }
        detail: { type: string }
    Proof:
      type: object
      required: [id, title, youtubeVideoId, youtubeUrl, durationSeconds, width, height, fileSizeBytes, hasAudio, state, statusMessage, model, timelineStatus, checks, sourcePlaybackAvailable, sourcePlaybackUrl, searchesUsed, searchLimit, updatedAt]
      properties:
        id: { type: string }
        title: { type: string }
        youtubeVideoId: { type: string }
        youtubeUrl: { type: string }
        durationSeconds: { type: number }
        width: { type: integer }
        height: { type: integer }
        fileSizeBytes: { type: integer }
        hasAudio: { type: boolean }
        state: { type: string, enum: [queued, uploading, processing, indexing, ready, failed, needs_review] }
        statusMessage: { type: string }
        model: { type: string }
        timelineStatus: { type: string, enum: [unverified, verified, mismatch] }
        sourcePlaybackAvailable: { type: boolean }
        sourcePlaybackUrl: { type: ["string", "null"] }
        checks:
          type: array
          items:
            $ref: "#/components/schemas/ProofCheck"
        searchesUsed: { type: integer }
        searchLimit: { type: integer }
        updatedAt: { type: string }
    SceneQuery:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query: { type: string, minLength: 1, maxLength: 500 }
        modality: { type: string, enum: [both, visual, audio], default: both }
    SceneMatch:
      type: object
      required: [rank, startSeconds, endSeconds, frameUrl, youtubeUrl]
      properties:
        rank: { type: integer }
        startSeconds: { type: number }
        endSeconds: { type: number }
        confidenceLabel: { type: ["string", "null"] }
        frameUrl: { type: string }
        youtubeUrl: { type: string }
    SceneSearch:
      type: object
      required: [id, query, modality, createdAt, latencyMs, matches, provider, partial]
      properties:
        id: { type: string }
        query: { type: string }
        modality: { type: string, enum: [both, visual, audio] }
        createdAt: { type: string }
        latencyMs: { type: integer }
        provider: { type: string, enum: [Twelve Labs] }
        partial: { type: boolean }
        matches:
          type: array
          items:
            $ref: "#/components/schemas/SceneMatch"
    ProofReport:
      type: object
      required: [proof, searches, limitations]
      properties:
        proof:
          $ref: "#/components/schemas/Proof"
        searches:
          type: array
          items:
            $ref: "#/components/schemas/SceneSearch"
        limitations:
          type: array
          items: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ReadinessStatus:
      type: object
      additionalProperties: false
      required: [status, checks, external]
      properties:
        status: { type: string, enum: [ready, not_ready] }
        checks:
          type: object
          additionalProperties: false
          required: [config, database, schema]
          properties:
            config: { type: string, enum: [ok, invalid] }
            database: { type: string, enum: [ok, unavailable] }
            schema: { type: string, enum: [ok, incompatible] }
        external:
          type: object
          additionalProperties: false
          required: [provider]
          properties:
            provider: { type: string, enum: [not_probed] }

