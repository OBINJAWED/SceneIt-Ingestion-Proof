openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: SceneIt one-video ingestion and semantic-search proof.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: billing
    description: Private hosted billing and membership usage operations
paths:
  /auth/session:
    get:
      operationId: getAuthSession
      summary: Read sign-in capabilities, private eligibility and usage allowances
      responses:
        "200":
          description: Current session, separate pilot/private admission, cumulative or recurring usage allowances, and CSRF token; never cached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthState"
  /auth/user:
    get:
      operationId: getCurrentAuthUser
      responses:
        "200":
          description: Current session and CSRF token; never cached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthState"
  /auth/firebase/challenge:
    get:
      operationId: getFirebaseChallenge
      summary: Start a short-lived same-origin email session exchange
      responses:
        "200":
          description: Session-exchange token bound to an HttpOnly flow cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthChallenge"
        "403": { $ref: "#/components/responses/Failure" }
        "429": { $ref: "#/components/responses/Failure" }
        "503": { $ref: "#/components/responses/Failure" }
  /auth/firebase/session:
    post:
      operationId: exchangeFirebaseSession
      summary: Exchange a fresh Firebase ID token for an application session
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FirebaseCredential"
      responses:
        "200":
          description: Verified application session; unverified email cannot process
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthState"
        "400": { $ref: "#/components/responses/Failure" }
        "401": { $ref: "#/components/responses/Failure" }
        "403": { $ref: "#/components/responses/Failure" }
        "429": { $ref: "#/components/responses/Failure" }
        "503": { $ref: "#/components/responses/Failure" }
  /billing/status:
    get:
      operationId: getBillingStatus
      tags: [billing]
      summary: Read the current account's membership and usage
      description: Returns private, owner-scoped billing state. The response must not be cached.
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Current membership and, when active, the effective monthly usage window
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingStatus" }
        "401": { $ref: "#/components/responses/BillingFailure" }
        "503": { $ref: "#/components/responses/BillingFailure" }
  /billing/checkout:
    post:
      operationId: createBillingCheckout
      tags: [billing]
      summary: Create an allowlisted Stripe-hosted subscription checkout
      description: Requires pilot admission. Price, customer, ownership, and return destinations are derived by the server.
      security: [{ sessionCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BillingCheckout" }
      responses:
        "200":
          description: Short-lived hosted checkout destination
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingHostedSession" }
        "400": { $ref: "#/components/responses/BillingFailure" }
        "401": { $ref: "#/components/responses/BillingFailure" }
        "402": { $ref: "#/components/responses/BillingFailure" }
        "403": { $ref: "#/components/responses/BillingFailure" }
        "409": { $ref: "#/components/responses/BillingFailure" }
        "429": { $ref: "#/components/responses/BillingFailure" }
        "500": { $ref: "#/components/responses/BillingFailure" }
        "503": { $ref: "#/components/responses/BillingFailure" }
  /billing/portal:
    post:
      operationId: createBillingPortal
      tags: [billing]
      summary: Create an owner-scoped Stripe-hosted customer portal
      description: Remains available to an authenticated billing customer without pilot admission or active membership.
      security: [{ sessionCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BillingOperationInput" }
      responses:
        "200":
          description: Short-lived hosted customer-portal destination
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingHostedSession" }
        "400": { $ref: "#/components/responses/BillingFailure" }
        "401": { $ref: "#/components/responses/BillingFailure" }
        "403": { $ref: "#/components/responses/BillingFailure" }
        "404": { $ref: "#/components/responses/BillingFailure" }
        "409": { $ref: "#/components/responses/BillingFailure" }
        "429": { $ref: "#/components/responses/BillingFailure" }
        "500": { $ref: "#/components/responses/BillingFailure" }
        "503": { $ref: "#/components/responses/BillingFailure" }
  /billing/change/preview:
    post:
      operationId: previewBillingChange
      tags: [billing]
      summary: Preview an allowlisted tier or cadence change
      description: Returns an expiring authoritative money and tax preview. Existing subscriptions cannot change currency.
      security: [{ sessionCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BillingChangeSelection" }
      responses:
        "200":
          description: Expiring server-authorized change preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingChangePreview" }
        "400": { $ref: "#/components/responses/BillingFailure" }
        "401": { $ref: "#/components/responses/BillingFailure" }
        "402": { $ref: "#/components/responses/BillingFailure" }
        "403": { $ref: "#/components/responses/BillingFailure" }
        "409": { $ref: "#/components/responses/BillingFailure" }
        "429": { $ref: "#/components/responses/BillingFailure" }
        "503": { $ref: "#/components/responses/BillingFailure" }
  /billing/change/confirm:
    post:
      operationId: confirmBillingChange
      tags: [billing]
      summary: Confirm an unexpired billing change preview
      description: Paid upgrades become effective only after verified payment. Scheduled changes remain pending until renewal.
      security: [{ sessionCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BillingChangeConfirmation" }
      responses:
        "200":
          description: Confirmed or payment-pending change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingChangeResult" }
        "400": { $ref: "#/components/responses/BillingFailure" }
        "401": { $ref: "#/components/responses/BillingFailure" }
        "402": { $ref: "#/components/responses/BillingFailure" }
        "403": { $ref: "#/components/responses/BillingFailure" }
        "409": { $ref: "#/components/responses/BillingFailure" }
        "429": { $ref: "#/components/responses/BillingFailure" }
        "503": { $ref: "#/components/responses/BillingFailure" }
  /billing/change/withdraw:
    post:
      operationId: withdrawBillingChange
      tags: [billing]
      summary: Withdraw a pending next-renewal billing change
      security: [{ sessionCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BillingChangeWithdrawal" }
      responses:
        "200":
          description: Withdrawn pending change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingChangeWithdrawalResult" }
        "400": { $ref: "#/components/responses/BillingFailure" }
        "401": { $ref: "#/components/responses/BillingFailure" }
        "403": { $ref: "#/components/responses/BillingFailure" }
        "409": { $ref: "#/components/responses/BillingFailure" }
        "429": { $ref: "#/components/responses/BillingFailure" }
        "503": { $ref: "#/components/responses/BillingFailure" }
  /billing/webhook:
    post:
      operationId: receiveBillingWebhook
      tags: [billing]
      summary: Verify and durably process a Stripe webhook
      description: The server validates Stripe-Signature against the unmodified bounded request body. This is not a browser endpoint.
      security: [{ stripeSignature: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BillingWebhookEvent" }
      responses:
        "200":
          description: Processing completed or was durably recorded for bounded recovery
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingWebhookAck" }
        "400": { $ref: "#/components/responses/BillingFailure" }
        "409": { $ref: "#/components/responses/BillingFailure" }
        "413": { $ref: "#/components/responses/BillingFailure" }
        "500": { $ref: "#/components/responses/BillingFailure" }
        "503": { $ref: "#/components/responses/BillingFailure" }
  /login:
    get:
      operationId: login
      parameters:
        - { name: returnTo, in: query, schema: { type: string } }
      responses:
        "302": { description: OIDC authorization redirect }
  /callback:
    get:
      operationId: authCallback
      responses:
        "302": { description: Verified session redirect }
  /logout:
    post:
      operationId: logout
      security: [{ sessionCookie: [], csrfToken: [] }]
      responses:
        "200":
          description: Session revoked
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success: { type: boolean }
  /imports/config:
    get:
      operationId: getImportConfig
      responses:
        "200":
          description: Enforced import limits and worker availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportConfig"
  /imports/current:
    get:
      operationId: getCurrentImport
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Most recent private import, or null
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/VideoImport"
                  - { type: "null" }
  /imports:
    post:
      operationId: createImport
      security: [{ sessionCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateImport"
      responses:
        "200": { $ref: "#/components/responses/ImportResponse" }
        "400": { $ref: "#/components/responses/Failure" }
        "401": { $ref: "#/components/responses/Failure" }
        "402": { $ref: "#/components/responses/BillingFailure" }
        "409": { $ref: "#/components/responses/Failure" }
        "429": { $ref: "#/components/responses/BillingFailure" }
        "503": { $ref: "#/components/responses/BillingFailure" }
  /imports/{importId}:
    parameters:
      - $ref: "#/components/parameters/ImportId"
    get:
      operationId: getImport
      security: [{ sessionCookie: [] }]
      responses:
        "200": { $ref: "#/components/responses/ImportResponse" }
        "404": { $ref: "#/components/responses/Failure" }
  /imports/{importId}/upload:
    parameters:
      - $ref: "#/components/parameters/ImportId"
    post:
      operationId: reserveImportUpload
      security: [{ sessionCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadRequest"
      responses:
        "200":
          description: Short-lived immutable private upload reservation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadReservation"
        "400": { $ref: "#/components/responses/Failure" }
        "402": { $ref: "#/components/responses/BillingFailure" }
        "409": { $ref: "#/components/responses/Failure" }
        "429": { $ref: "#/components/responses/BillingFailure" }
        "503": { $ref: "#/components/responses/BillingFailure" }
  /imports/{importId}/complete:
    parameters:
      - $ref: "#/components/parameters/ImportId"
    post:
      operationId: completeImportUpload
      description: Enqueue validation of stored bytes, not proof of completed indexing.
      security: [{ sessionCookie: [], csrfToken: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmptyRequest" }
      responses:
        "200": { $ref: "#/components/responses/ImportResponse" }
        "402": { $ref: "#/components/responses/BillingFailure" }
        "409": { $ref: "#/components/responses/Failure" }
        "429": { $ref: "#/components/responses/BillingFailure" }
        "503": { $ref: "#/components/responses/BillingFailure" }
  /imports/{importId}/cancel:
    parameters:
      - $ref: "#/components/parameters/ImportId"
    post:
      operationId: cancelImport
      security: [{ sessionCookie: [], csrfToken: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmptyRequest" }
      responses:
        "200": { $ref: "#/components/responses/ImportResponse" }
  /imports/{importId}/playback:
    parameters:
      - $ref: "#/components/parameters/ImportId"
    post:
      operationId: authorizeImportPlayback
      security: [{ sessionCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaybackAuthorization" }
      responses:
        "200": { $ref: "#/components/responses/ImportResponse" }
  /imports/{importId}/source:
    parameters:
      - $ref: "#/components/parameters/ImportId"
    get:
      operationId: streamImportSource
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: Range, in: header, schema: { type: string } }
      responses:
        "200":
          description: Owner-authorized private source
          content:
            video/mp4:
              schema: { type: string, format: binary }
        "206":
          description: Owner-authorized source byte range
          content:
            video/mp4:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/Failure" }
        "402": { $ref: "#/components/responses/BillingFailure" }
        "429": { $ref: "#/components/responses/BillingFailure" }
        "503": { $ref: "#/components/responses/BillingFailure" }
        "416": { $ref: "#/components/responses/Failure" }
  /imports/{importId}/searches:
    parameters:
      - $ref: "#/components/parameters/ImportId"
    get:
      operationId: listImportSearches
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Owner-only saved searches
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ImportSearch" }
    post:
      operationId: searchImport
      security: [{ sessionCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SceneQuery" }
      responses:
        "200":
          description: Provider-ranked candidate moments from this indexed asset only
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportSearch" }
        "402": { $ref: "#/components/responses/BillingFailure" }
        "409": { $ref: "#/components/responses/Failure" }
        "429": { $ref: "#/components/responses/BillingFailure" }
        "502": { $ref: "#/components/responses/Failure" }
        "503": { $ref: "#/components/responses/BillingFailure" }
  /imports/{importId}/searches/{searchId}/frames/{rank}:
    parameters:
      - $ref: "#/components/parameters/ImportId"
      - { name: searchId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: rank, in: path, required: true, schema: { type: integer, minimum: 1, maximum: 5 } }
    get:
      operationId: getImportFrame
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Private source still at the candidate segment midpoint
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "402": { $ref: "#/components/responses/BillingFailure" }
        "429": { $ref: "#/components/responses/BillingFailure" }
        "503": { $ref: "#/components/responses/BillingFailure" }
        "404": { $ref: "#/components/responses/Failure" }
  /proof:
    get:
      operationId: getProof
      tags: [proof]
      summary: Read the current one-video proof and its measured checks
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Current proof
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proof"
        "401": { $ref: "#/components/responses/ProtectedFailure" }
        "403": { $ref: "#/components/responses/ProtectedFailure" }
        "503": { $ref: "#/components/responses/ProtectedFailure" }
  /proof/readiness:
    get:
      operationId: getProofReadiness
      tags: [proof]
      summary: Read proof search and media readiness without probing providers
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Current proof readiness and degradation state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProofReadiness" }
        "401": { $ref: "#/components/responses/ProtectedFailure" }
        "403": { $ref: "#/components/responses/ProtectedFailure" }
        "503": { $ref: "#/components/responses/ProtectedFailure" }
  /proof/search-operations:
    get:
      operationId: listProofSearchOperations
      tags: [proof]
      summary: List bounded search attempts for operator-visible reconciliation
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Search operations, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SearchOperation" }
        "401": { $ref: "#/components/responses/ProtectedFailure" }
        "403": { $ref: "#/components/responses/ProtectedFailure" }
        "503": { $ref: "#/components/responses/ProtectedFailure" }
  /proof/searches:
    get:
      operationId: listProofSearches
      tags: [proof]
      summary: Previously executed real searches, newest first
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Search history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SceneSearch"
        "401": { $ref: "#/components/responses/ProtectedFailure" }
        "403": { $ref: "#/components/responses/ProtectedFailure" }
        "503": { $ref: "#/components/responses/ProtectedFailure" }
    post:
      operationId: searchScenes
      tags: [proof]
      summary: Search the single indexed video using Twelve Labs
      security: [{ sessionCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SceneQuery"
      responses:
        "200":
          description: Actual provider results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SceneSearch"
        "400":
          $ref: "#/components/responses/Failure"
        "409":
          $ref: "#/components/responses/Failure"
        "429":
          $ref: "#/components/responses/Failure"
        "502":
          $ref: "#/components/responses/Failure"
        "503":
          $ref: "#/components/responses/ProtectedFailure"
        "401": { $ref: "#/components/responses/ProtectedFailure" }
        "403": { $ref: "#/components/responses/ProtectedFailure" }
  /proof/searches/{searchId}/frames/{rank}:
    parameters:
      - { name: searchId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: rank, in: path, required: true, schema: { type: integer, minimum: 1, maximum: 5 } }
    get:
      operationId: getProofFrame
      tags: [proof]
      summary: Read a retained source frame for a shared proof result
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: JPEG source frame
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/ProtectedFailure" }
        "403": { $ref: "#/components/responses/ProtectedFailure" }
        "404": { $ref: "#/components/responses/ProtectedFailure" }
  /proof/report:
    get:
      operationId: getProofReport
      tags: [proof]
      summary: Download measured proof evidence as JSON
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Proof evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProofReport"
        "401": { $ref: "#/components/responses/ProtectedFailure" }
        "403": { $ref: "#/components/responses/ProtectedFailure" }
        "503": { $ref: "#/components/responses/ProtectedFailure" }
  /proof/source:
    get:
      operationId: streamProofSource
      tags: [proof]
      summary: Stream the rights-approved original with HTTP byte-range support
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Complete original source
          content:
            video/mp4:
              schema: { type: string, format: binary }
        "206":
          description: Requested byte range from the original source
          content:
            video/mp4:
              schema: { type: string, format: binary }
        "404":
          $ref: "#/components/responses/Failure"
        "416":
          $ref: "#/components/responses/ProtectedFailure"
        "401": { $ref: "#/components/responses/ProtectedFailure" }
        "403": { $ref: "#/components/responses/ProtectedFailure" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /readyz:
    get:
      operationId: readinessCheck
      tags: [health]
      summary: Check bounded configuration, database, and schema readiness
      responses:
        "200":
          description: Service is ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadinessStatus" }
        "503":
          description: Service is not ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadinessStatus" }
components:
  securitySchemes:
    sessionCookie: { type: apiKey, in: cookie, name: __Host-sceneit_session }
    csrfToken: { type: apiKey, in: header, name: X-CSRF-Token }
    stripeSignature: { type: apiKey, in: header, name: Stripe-Signature }
  parameters:
    ImportId:
      name: importId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    ImportResponse:
      description: Current private import
      content:
        application/json:
          schema: { $ref: "#/components/schemas/VideoImport" }
    Failure:
      description: Safe, actionable failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiFailure"
    ProtectedFailure:
      description: Typed protected-resource failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProtectedApiFailure"
    BillingFailure:
      description: Safe billing, entitlement, quota, capacity, or validation failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BillingProblem"
  schemas:
    EmptyRequest:
      type: object
      additionalProperties: false
    PlaybackAuthorization:
      type: object
      additionalProperties: false
      required: [authorized]
      properties:
        authorized: { type: boolean }
    AuthState:
      type: object
      required: [user, csrfToken, pilotAdmitted, capabilities, privateAccess, usage]
      properties:
        csrfToken: { type: [string, "null"] }
        pilotAdmitted:
          type: boolean
          description: Server-authoritative pilot admission. False for anonymous, denied, or indeterminate sessions.
        user:
          type: [object, "null"]
          required: [id, firstName, provider, email, emailVerified]
          properties:
            id: { type: string }
            firstName: { type: [string, "null"] }
            provider: { type: string, enum: [replit, firebase] }
            email: { type: [string, "null"] }
            emailVerified: { type: boolean }
        capabilities: { $ref: "#/components/schemas/AuthCapabilities" }
        privateAccess: { $ref: "#/components/schemas/PrivateAccess" }
        usage:
          anyOf:
            - $ref: "#/components/schemas/TrialUsage"
            - { type: "null" }
    AuthChallenge:
      type: object
      required: [csrfToken]
      properties:
        csrfToken: { type: string }
    FirebaseCredential:
      type: object
      additionalProperties: false
      required: [idToken]
      properties:
        idToken: { type: string, minLength: 20, maxLength: 8192 }
    AuthCapabilities:
      type: object
      required: [replit, emailPassword, publicTrialEnabled, firebaseConfig, unavailableReason]
      properties:
        replit: { type: boolean }
        emailPassword: { type: boolean }
        publicTrialEnabled: { type: boolean }
        unavailableReason:
          type: [string, "null"]
          enum: [public_trial_disabled, firebase_not_configured, null]
        firebaseConfig:
          type: [object, "null"]
          required: [apiKey, authDomain, projectId, appId]
          description: Public web configuration only, never Admin credentials
          properties:
            apiKey: { type: string }
            authDomain: { type: string }
            projectId: { type: string }
            appId: { type: string }
    PrivateAccess:
      type: object
      required: [allowed, reason]
      properties:
        allowed:
          type: boolean
          description: Identity eligibility for new private work; quotas and worker availability are checked separately
        reason:
          type: string
          enum: [ready, authentication_required, verification_required, public_trial_disabled, firebase_not_configured, identity_unavailable, pilot_not_admitted]
    TrialUsage:
      type: object
      description: Operation allowances, not a dollar ceiling. Firebase trial usage is cumulative with no monthly reset; paid Replit-owner usage follows incoming recurring commercial allowance windows.
      required: [importsUsed, importLimit, importsRemaining, searchesUsed, searchLimit, searchesRemaining, lifetime]
      properties:
        importsUsed: { type: integer, minimum: 0 }
        importLimit: { type: integer, minimum: 0 }
        importsRemaining: { type: integer, minimum: 0 }
        searchesUsed: { type: integer, minimum: 0 }
        searchLimit: { type: integer, minimum: 0 }
        searchesRemaining: { type: integer, minimum: 0 }
        lifetime:
          type: boolean
          description: True for cumulative Firebase trial allowances; false for recurring paid Replit-owner allowances.
    BillingCheckout:
      type: object
      additionalProperties: false
      required: [tier, cadence, currency, idempotencyKey]
      properties:
        tier: { type: string, minLength: 1, maxLength: 64 }
        cadence: { $ref: "#/components/schemas/BillingCadence" }
        currency: { type: string, pattern: "^[a-z]{3}$" }
        idempotencyKey: { type: string, format: uuid }
    BillingOperationInput:
      type: object
      additionalProperties: false
      required: [action, idempotencyKey]
      properties:
        action: { type: string, enum: [manage, cancel] }
        idempotencyKey: { type: string, format: uuid }
    BillingChangeSelection:
      type: object
      additionalProperties: false
      required: [tier, cadence, currency, idempotencyKey]
      properties:
        tier: { type: string, minLength: 1, maxLength: 64 }
        cadence: { $ref: "#/components/schemas/BillingCadence" }
        currency: { type: string, pattern: "^[a-z]{3}$" }
        idempotencyKey: { type: string, format: uuid }
    BillingChangeConfirmation:
      type: object
      additionalProperties: false
      required: [previewId, idempotencyKey]
      properties:
        previewId: { type: string, format: uuid }
        idempotencyKey: { type: string, format: uuid }
    BillingChangeWithdrawal:
      type: object
      additionalProperties: false
      required: [changeId, idempotencyKey]
      properties:
        changeId: { type: string, format: uuid }
        idempotencyKey: { type: string, format: uuid }
    BillingHostedSession:
      type: object
      additionalProperties: false
      required: [operationId, url, expiresAt]
      properties:
        operationId: { type: string, format: uuid }
        url: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }
    BillingCadence:
      type: string
      enum: [monthly, yearly]
    BillingOffer:
      type: object
      additionalProperties: false
      required: [tier, name, rank, cadence, currency, capabilities, limits, unitAmount, taxBehavior]
      properties:
        tier: { type: string }
        name: { type: string }
        rank: { type: integer, minimum: 0, maximum: 1000 }
        cadence: { $ref: "#/components/schemas/BillingCadence" }
        currency: { type: string, pattern: "^[a-z]{3}$" }
        capabilities:
          type: array
          items: { type: string }
        limits: { $ref: "#/components/schemas/BillingTierLimits" }
        unitAmount: { type: integer, minimum: 1 }
        taxBehavior: { type: string, enum: [inclusive, exclusive] }
    BillingTierLimits:
      type: object
      additionalProperties: false
      required: [imports, upload_attempts, analysis_seconds, searches, media_bytes, frames, storage_bytes]
      properties:
        imports: { type: integer, minimum: 1 }
        upload_attempts: { type: integer, minimum: 1 }
        analysis_seconds: { type: integer, minimum: 1 }
        searches: { type: integer, minimum: 1 }
        media_bytes: { type: integer, minimum: 1 }
        frames: { type: integer, minimum: 1 }
        storage_bytes: { type: integer, minimum: 1 }
    BillingPendingChange:
      type: object
      additionalProperties: false
      required: [changeId, tier, cadence, currency, effectiveAt, state]
      properties:
        changeId: { type: string, format: uuid }
        tier: { type: string }
        cadence: { $ref: "#/components/schemas/BillingCadence" }
        currency: { type: string, pattern: "^[a-z]{3}$" }
        effectiveAt: { type: string, format: date-time }
        state: { type: string, enum: [confirming, payment_pending, scheduled, uncertain] }
    BillingOperationState:
      type: object
      additionalProperties: false
      required: [idempotencyKey, kind, state]
      properties:
        idempotencyKey: { type: string, format: uuid }
        kind: { type: string, enum: [checkout, portal, upgrade, schedule, withdraw] }
        state:
          type: string
          enum: [creating, created, confirming, confirmed, scheduled, payment_pending, completed, uncertain, withdrawn, expired, failed]
    BillingPaymentProblem:
      type: object
      additionalProperties: false
      required: [code, state, invoiceId, tier, cadence, currency, amountDue, nextAction, occurredAt, resolvedAt]
      properties:
        code: { type: string, enum: [payment_failed, expired_card, payment_authentication_required] }
        state: { type: string, enum: [open, resolved] }
        invoiceId: { type: ["string", "null"] }
        tier: { type: ["string", "null"] }
        cadence:
          anyOf:
            - $ref: "#/components/schemas/BillingCadence"
            - { type: "null" }
        currency: { type: ["string", "null"], pattern: "^[a-z]{3}$" }
        amountDue: { type: ["integer", "null"], minimum: 0 }
        nextAction: { type: string, enum: [manage_billing, authenticate_payment] }
        occurredAt: { type: string, format: date-time }
        resolvedAt: { type: ["string", "null"], format: date-time }
    BillingChangePreview:
      type: object
      additionalProperties: false
      required: [previewId, kind, effectiveAt, expiresAt, currency, subtotal, tax, total]
      properties:
        previewId: { type: string, format: uuid }
        kind: { type: string, enum: [upgrade, scheduled] }
        effectiveAt: { type: [string, "null"], format: date-time }
        expiresAt: { type: string, format: date-time }
        currency: { type: string, pattern: "^[a-z]{3}$" }
        subtotal: { type: integer }
        tax: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }
    BillingHostedAction:
      type: object
      additionalProperties: false
      required: [url, expiresAt]
      properties:
        url: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }
    BillingChangeResult:
      type: object
      additionalProperties: false
      required: [changeId, state, effectiveAt, hostedAction]
      properties:
        changeId: { type: string, format: uuid }
        state: { type: string, enum: [scheduled, payment_pending, effective, outcome_unknown] }
        effectiveAt: { type: [string, "null"], format: date-time }
        hostedAction:
          anyOf:
            - $ref: "#/components/schemas/BillingHostedAction"
            - { type: "null" }
    BillingChangeWithdrawalResult:
      type: object
      additionalProperties: false
      required: [changeId, state]
      properties:
        changeId: { type: string, format: uuid }
        state: { type: string, enum: [withdrawn] }
    BillingWebhookEvent:
      type: object
      description: Provider event whose exact raw bytes are verified before parsing.
      additionalProperties: true
    BillingWebhookAck:
      type: object
      additionalProperties: false
      required: [received]
      properties:
        received: { type: boolean, const: true }
    BillingMetric:
      type: object
      additionalProperties: false
      required: [limit, used, remaining]
      properties:
        limit: { type: integer, minimum: 0 }
        used: { type: integer, minimum: 0 }
        remaining: { type: integer, minimum: 0 }
    BillingMetrics:
      type: object
      additionalProperties: false
      required: [imports, upload_attempts, analysis_seconds, searches, media_bytes, frames]
      properties:
        imports: { $ref: "#/components/schemas/BillingMetric" }
        upload_attempts: { $ref: "#/components/schemas/BillingMetric" }
        analysis_seconds: { $ref: "#/components/schemas/BillingMetric" }
        searches: { $ref: "#/components/schemas/BillingMetric" }
        media_bytes: { $ref: "#/components/schemas/BillingMetric" }
        frames: { $ref: "#/components/schemas/BillingMetric" }
    BillingUsage:
      type: object
      additionalProperties: false
      required: [windowStart, windowEnd, metrics, storage, workStopped]
      properties:
        windowStart: { type: [string, "null"], format: date-time }
        windowEnd: { type: [string, "null"], format: date-time }
        metrics: { $ref: "#/components/schemas/BillingMetrics" }
        storage: { $ref: "#/components/schemas/BillingMetric" }
        workStopped: { type: boolean }
    BillingStatus:
      type: object
      additionalProperties: false
      required: [enabled, environment, membership, effectiveTier, cadence, currency, paidThrough, cancelAtPeriodEnd, usage, pendingChange, paymentProblem, managementEligible, offers]
      properties:
        enabled: { type: boolean }
        environment: { type: [string, "null"], enum: [test, live, null] }
        membership: { type: string, enum: [disabled, active, inactive] }
        effectiveTier: { type: ["string", "null"] }
        cadence:
          anyOf:
            - $ref: "#/components/schemas/BillingCadence"
            - { type: "null" }
        currency: { type: ["string", "null"], pattern: "^[a-z]{3}$" }
        paidThrough: { type: [string, "null"], format: date-time }
        cancelAtPeriodEnd: { type: boolean }
        usage:
          anyOf:
            - $ref: "#/components/schemas/BillingUsage"
            - { type: "null" }
        pendingChange:
          anyOf:
            - $ref: "#/components/schemas/BillingPendingChange"
            - { type: "null" }
        paymentProblem:
          anyOf:
            - $ref: "#/components/schemas/BillingPaymentProblem"
            - { type: "null" }
        managementEligible: { type: boolean }
        offers:
          type: array
          items: { $ref: "#/components/schemas/BillingOffer" }
        operationStates:
          type: array
          maxItems: 50
          description: Bounded owner-scoped operation outcomes used only to reconcile previously submitted idempotency keys.
          items: { $ref: "#/components/schemas/BillingOperationState" }
    BillingProblem:
      type: object
      additionalProperties: false
      description: |
        Safe commercial-work failure. Current domain code/status mappings are:
        `invalid_request`, `invalid_plan`, `invalid_idempotency_key`, `invalid_webhook` (400);
        `http_401` (401); `membership_required` (402);
        `pilot_not_admitted`, `origin_rejected`, `http_403` (403);
        `billing_customer_missing` (404);
        `idempotency_conflict`, `checkout_outcome_unknown`, `subscription_exists`,
        `billing_environment_mismatch`, `billing_customer_outcome_unknown`,
        `billing_relationship_invalid`, `reservation_conflict`, `reservation_released`,
        `webhook_rejected`, `invoice_not_paid`, `checkout_completed`, `checkout_exists`,
        `checkout_plan_conflict`, `checkout_state_invalid` (409);
        `participant_throttled`, `owner_quota_exhausted`, `storage_quota_exhausted`,
        `owner_import_limit`, `owner_search_limit`, `app_import_limit`,
        `app_search_limit` (429);
        and `billing_disabled`, `billing_unavailable`, `billing_provider_unavailable`,
        `provider_outcome_unknown`, `provider_rejected`, `service_work_stopped`,
        `service_capacity_exhausted`, `database_unavailable`,
        `database_capacity_exhausted`, `upstream_unavailable` (503).
        `webhook_too_large` is 413 and an unexpected failure is `internal_error` (500).
        Validation failures use `invalid_request`; `validation_error` is reserved for
        compatible validation emitters.
      required: [error, code, state]
      properties:
        error: { type: string }
        code:
          type: string
          enum:
            - membership_required
            - billing_disabled
            - service_work_stopped
            - service_capacity_exhausted
            - owner_quota_exhausted
            - storage_quota_exhausted
            - owner_import_limit
            - owner_search_limit
            - app_import_limit
            - app_search_limit
            - billing_unavailable
            - validation_error
            - invalid_request
            - invalid_plan
            - invalid_idempotency_key
            - invalid_portal_action
            - pilot_not_admitted
            - origin_rejected
            - http_401
            - http_403
            - billing_customer_missing
            - billing_environment_mismatch
            - billing_customer_outcome_unknown
            - billing_relationship_invalid
            - idempotency_conflict
            - checkout_outcome_unknown
            - checkout_completed
            - checkout_exists
            - checkout_plan_conflict
            - checkout_state_invalid
            - subscription_exists
            - subscription_missing
            - offer_unavailable
            - currency_change_unsupported
            - change_missing
            - change_not_required
            - change_not_withdrawable
            - preview_missing
            - preview_expired
            - portal_outcome_unknown
            - reservation_conflict
            - reservation_released
            - provider_outcome_unknown
            - provider_deadline_exceeded
            - provider_rejected
            - invalid_provider_response
            - unsafe_portal_configuration
            - invalid_price_configuration
            - invalid_change_preview
            - invalid_schedule_relationship
            - invalid_reversal_relationship
            - invalid_refund_relationship
            - invalid_invoice_relationship
            - invalid_invoice_payment_relationship
            - invalid_payment_problem
            - invalid_subscription_relationship
            - subscription_listing_truncated
            - schedule_listing_truncated
            - customer_listing_truncated
            - checkout_listing_truncated
            - invalid_webhook
            - webhook_too_large
            - webhook_rejected
            - invoice_not_paid
            - billing_provider_unavailable
            - billing_outcome_unknown
            - participant_throttled
            - database_unavailable
            - database_capacity_exhausted
            - upstream_unavailable
            - internal_error
        state:
          type: string
          enum: [admission_required, verification_required, trial_exhausted, capacity_exhausted, configuration_required, quota_exhausted, processing, uncertain, service_unavailable, not_found, unauthorized]
        retryable: { type: boolean, default: false }
        retryAfterSeconds: { type: ["integer", "null"], minimum: 0 }
    ImportConfig:
      type: object
      required: [maxBytes, minDurationSeconds, maxDurationSeconds, retentionDays, ownerImportLimit, appImportLimit, ownerSearchLimit, appSearchLimit, quotaMode, workerAvailable]
      properties:
        maxBytes: { type: integer }
        minDurationSeconds: { type: number }
        maxDurationSeconds: { type: number }
        retentionDays: { type: integer }
        ownerImportLimit: { type: integer }
        appImportLimit: { type: integer }
        ownerSearchLimit: { type: integer }
        appSearchLimit: { type: integer }
        quotaMode:
          type: string
          enum: [lifetime, monthly]
          description: Whether reported owner import/search limits are pilot lifetime counters or commercial monthly allowances.
        workerAvailable: { type: boolean }
    CreateImport:
      type: object
      additionalProperties: false
      required: [entryMethod, analysisAuthorized, playbackAuthorized, idempotencyKey]
      properties:
        entryMethod: { type: string, enum: [upload, link] }
        sourceUrl: { type: string, maxLength: 2048 }
        analysisAuthorized: { type: boolean, enum: [true] }
        playbackAuthorized: { type: boolean }
        idempotencyKey: { type: string, format: uuid }
    UploadRequest:
      type: object
      additionalProperties: false
      required: [fileName, sizeBytes, contentType]
      properties:
        fileName: { type: string, minLength: 1, maxLength: 255 }
        sizeBytes: { type: integer, minimum: 1, maximum: 200000000 }
        contentType: { type: string, enum: [video/mp4] }
    UploadReservation:
      type: object
      required: [import, uploadURL, method, headers, expiresAt]
      properties:
        import: { $ref: "#/components/schemas/VideoImport" }
        uploadURL: { type: string }
        method: { type: string, enum: [PUT, POST] }
        headers: { type: object, additionalProperties: { type: string } }
        expiresAt: { type: string }
    VideoImport:
      type: object
      required: [id, title, entryMethod, sourceKind, sourceUrl, externalId, state, statusMessage, progressPercent, errorCode, durationSeconds, fileSizeBytes, hasAudio, sourcePlaybackAvailable, sourcePlaybackUrl, playbackAuthorized, timelineStatus, createdAt, updatedAt, expiresAt, searchesUsed, searchLimit, importsUsed, importLimit, quotaMode, budgetReserved]
      properties:
        id: { type: string }
        budgetReserved:
          type: boolean
          description: This import has already consumed a lifetime attempt; continuation never consumes another attempt
        title: { type: string }
        entryMethod: { type: string, enum: [upload, link] }
        sourceKind: { type: string, enum: [file, youtube, x, tiktok, vimeo] }
        sourceUrl: { type: [string, "null"] }
        externalId: { type: [string, "null"] }
        state: { type: string, enum: [file_required, awaiting_upload, queued, resolving, validating, uploading, processing, indexing, ready, failed, needs_review, cancel_requested, cancelled, expired] }
        statusMessage: { type: string }
        progressPercent: { type: [number, "null"] }
        errorCode: { type: [string, "null"] }
        durationSeconds: { type: [number, "null"] }
        fileSizeBytes: { type: [integer, "null"] }
        hasAudio: { type: [boolean, "null"] }
        sourcePlaybackAvailable: { type: boolean }
        sourcePlaybackUrl: { type: [string, "null"] }
        playbackAuthorized: { type: boolean }
        timelineStatus: { type: string, enum: [not_applicable, unverified] }
        createdAt: { type: string }
        updatedAt: { type: string }
        expiresAt: { type: string }
        searchesUsed: { type: integer }
        searchLimit: { type: integer }
        importsUsed: { type: integer }
        importLimit: { type: integer }
        quotaMode:
          type: string
          enum: [lifetime, monthly]
          description: Semantics of the reported import and search counters.
    ImportMatch:
      type: object
      required: [rank, startSeconds, endSeconds, confidenceLabel, frameUrl, sourceUrl]
      properties:
        rank: { type: integer, minimum: 1, maximum: 5 }
        startSeconds: { type: number }
        endSeconds: { type: number }
        confidenceLabel: { type: [string, "null"] }
        frameUrl: { type: string }
        sourceUrl: { type: [string, "null"] }
    ImportSearch:
      type: object
      required: [id, query, modality, createdAt, latencyMs, matches, provider, partial]
      properties:
        id: { type: string }
        query: { type: string }
        modality: { type: string, enum: [both, visual, audio] }
        createdAt: { type: string }
        latencyMs: { type: integer }
        provider: { type: string, enum: [Twelve Labs] }
        partial: { type: boolean }
        matches:
          type: array
          maxItems: 5
          items: { $ref: "#/components/schemas/ImportMatch" }
    ApiFailure:
      type: object
      required: [error, code]
      properties:
        error: { type: string }
        code: { type: string }
        state:
          type: string
          enum: [admission_required, verification_required, trial_exhausted, capacity_exhausted, configuration_required, quota_exhausted, processing, uncertain, service_unavailable, not_found, unauthorized]
    ProtectedApiFailure:
      type: object
      additionalProperties: false
      required: [error, code, state]
      properties:
        error: { type: string }
        code: { type: string }
        state:
          type: string
          enum: [admission_required, verification_required, trial_exhausted, capacity_exhausted, configuration_required, quota_exhausted, processing, uncertain, service_unavailable, not_found, unauthorized]
        retryable: { type: boolean, default: false }
        retryAfterSeconds: { type: ["integer", "null"], minimum: 0 }
    ProofReadiness:
      type: object
      additionalProperties: false
      required: [state, proofState, searchAvailable, searchesUsed, searchLimit, detail, retryAfterSeconds]
      properties:
        state:
          type: string
          enum: [ready, admission_required, quota_exhausted, processing, uncertain, service_unavailable]
        proofState:
          type: string
          enum: [queued, uploading, processing, indexing, ready, failed, needs_review]
        searchAvailable: { type: boolean }
        searchesUsed: { type: integer, minimum: 0 }
        searchLimit: { type: integer, minimum: 0 }
        detail: { type: ["string", "null"] }
        retryAfterSeconds: { type: ["integer", "null"], minimum: 0 }
    SearchOperation:
      type: object
      additionalProperties: false
      required: [id, state, attemptId, createdAt, deadlineAt, completedAt, errorCode]
