kind = "web"
previewPath = "/"
title = "SceneIt — Private Video Search"
description = "Upload an authorized MP4 or supply a supported video link, then find relevant moments through private single-video search. Includes the preserved original proof demo."
version = "1.0.0"
id = "artifacts/sceneit"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24046

[services.development]
run = "pnpm --filter @workspace/sceneit run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sceneit", "run", "build" ]
serve = "static"
publicDir = "artifacts/sceneit/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24046"
BASE_PATH = "/"
